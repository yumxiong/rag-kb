# No application exposure or TLS dependency before first certificate issuance.
server {
    listen 80 default_server;
    server_name _;
    location = /health { access_log off; return 200 'initialization\n'; }
    location / { return 404; }
}
server {
    listen 80;
    server_name otocshow.xyz next.otocshow.xyz;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 503 'Certificate provisioning pending.\n'; }
}
