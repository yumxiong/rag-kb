# Unknown hosts (including www, served by Dynadot) never reach an application.
server {
    listen 80 default_server;
    server_name _;
    location = /health {
        proxy_pass http://backend:8000/health;
        access_log off;
    }
    location / { return 404; }
}
server {
    listen 443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
}
