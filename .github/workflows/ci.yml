name: CI
on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
jobs:
  lint-style:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install black isort
      - name: Black
        run: black --check app/ tests/
      - name: isort
        run: isort --check-only app/ tests/
  lint-flake8:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8
      - name: Flake8
        run: flake8 app/ tests/ --max-line-length=88 --extend-ignore=E203,W503
  test:
    runs-on: ubuntu-latest
    needs: lint-style   # 只依赖格式检查，不依赖 flake8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Prepare runtime dirs
        run: mkdir -p data/uploads data/chroma_db logs

      - name: Run tests
        env:
          OPENAI_API_KEY: test-key
          PYTHONPATH: .
        run: pytest tests/ --cov=app --cov-fail-under=70