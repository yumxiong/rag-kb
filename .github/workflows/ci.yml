name: CI
permissions:
  contents: read
on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install markdown-it-py==4.2.0
      - run: python scripts/check_docs.py
  lint-style:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install black isort
      - name: Black
        run: black --check app/ tests/ frontend/ scripts/check_docs.py
      - name: isort
        run: isort --check-only app/ tests/ frontend/ scripts/check_docs.py
  lint-flake8:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8
      - name: Flake8
        run: flake8 app/ tests/ scripts/check_docs.py --max-line-length=88 --extend-ignore=E203,W503
  test:
    runs-on: ubuntu-latest
    needs: [lint-style, lint-flake8]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Prepare runtime dirs
        run: mkdir -p data/uploads data/chroma_db logs

      - name: Run tests
        env:
          OPENAI_API_KEY: test-key
          PYTHONPATH: .
        run: pytest tests/ --cov=app --cov-fail-under=70
